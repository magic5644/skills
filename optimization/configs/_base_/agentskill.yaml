# ──────────────────────────────────────────────────────────────
# Shared base config for optimizing the skills in this repository.
# Per-skill configs inherit this file and only set env-specific keys.
# ──────────────────────────────────────────────────────────────
_base_: ../../../.skillopt/SkillOpt/configs/_base_/default.yaml

env:
  name: agentskill
  split_mode: split_dir        # datasets ship pre-split as train/ val/ test/
  split_seed: 42
  workers: 4                   # parallel rollouts (target + judge calls); use 1-2 for exec backends
  max_completion_tokens: 4096
  hard_threshold: 0.8          # rubric pass-rate needed for hard=1
  limit: 0                     # >0 samples a few items for a smoke run
  exec_timeout: 300            # per agent-CLI call, exec backends only (claude_code_exec, ...)

train:
  num_epochs: 4
  batch_size: 6                # = size of the train split
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 3
  merge_batch_size: 3
  analyst_workers: 4
  failure_only: false          # successes also teach: they justify keeping text

optimizer:
  learning_rate: 3             # max edits per step
  min_learning_rate: 1
  lr_scheduler: cosine
  skill_update_mode: patch     # bounded edits, never a blind full rewrite
  use_slow_update: true
  slow_update_samples: 8
  use_meta_skill: true

evaluation:
  use_gate: true               # keep an edit only if held-out validation improves
  sel_env_num: 0               # 0 = use the whole val split
  test_env_num: 0              # 0 = use the whole test split
  eval_test: true

model:
  # Override per run with --cfg-options, or via scripts/skillopt-optimize.sh flags.
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium
