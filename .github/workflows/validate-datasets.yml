name: Validate optimization datasets

on:
  push:
    paths:
      - "optimization/**"
      - "*/SKILL.md"
      - ".github/workflows/validate-datasets.yml"
  pull_request:
    paths:
      - "optimization/**"
      - "*/SKILL.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evaluation datasets
        run: python3 optimization/validate_datasets.py
